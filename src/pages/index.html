    <style>
        #latestAlbum {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2rem 0;
        }

        #latestAlbum>* {
            width: 50%;
        }

        #latestAlbumJacketImg {
            display: inline-flex;
            justify-content: flex-end;
            margin: 2rem;
        }

        #latestAlbumJacketImg>img {
            --size: 24rem;
            width: var(--size);
            height: var(--size);
        }

        #latestAlbumInfo {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 2rem;
            font-family: "Poppins", sans-serif;
            font-weight: bold;
        }

        #latestAlbumName {
            font-size: 2rem;
        }

        #latestAlbumLabel::after {
            display: inline-block;
            width: 3rem;
            height: 2px;
            /* margin-top: 0em; */
            background-color: #808080ff;
            content: "";
        }

        #latestAlbumMoreButton {
            margin: 1rem 0;
        }

        @media (max-width: 768px) {
            #latestAlbum {
                flex-direction: column;
            }

            #latestAlbum>* {
                width: 100%;
            }

            #latestAlbumJacketImg {
                justify-content: center;
            }

            #latestAlbumJacketImg>img {
                --size: 75vw;
                height: 100%;
            }

            #latestAlbumInfo {
                align-items: center;
                text-align: center;
            }
        }
    </style>
